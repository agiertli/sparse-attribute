schemaVersion: 2.2.2
metadata:
  name: python-2cpu
  displayName: Python (2 CPU)
  description: Python development environment with 2 CPU limit
  tags:
    - Python
components:
  - name: dev
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.30-1787764814
      cpuLimit: "2"
      memoryLimit: 4Gi
projects:
  - name: python-2cpu
    git:
      remotes:
        origin: https://github.com/agiertli/sparse-attribute.git
commands:
  - id: sparse-checkout
    exec:
      commandLine: |
        cd ${PROJECT_SOURCE} &&
        git config core.repositoryFormatVersion 1 &&
        git sparse-checkout init --cone &&
        git sparse-checkout set PYTHON/2CPU
      component: dev
events:
  postStart:
    - sparse-checkout
