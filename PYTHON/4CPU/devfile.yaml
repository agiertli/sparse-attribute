schemaVersion: 2.2.2
metadata:
  name: python-4cpu
  displayName: Python (4 CPU)
  description: Python development environment with 4 CPU limit
  tags:
    - Python
components:
  - name: dev
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.30-1787764814
      cpuLimit: "4"
      memoryLimit: 8Gi
projects:
  - name: python-4cpu
    git:
      remotes:
        origin: https://github.com/agiertli/sparse-attribute.git
commands:
  - id: sparse-checkout
    exec:
      commandLine: |
        cd ${PROJECT_SOURCE} &&
        git config core.repositoryFormatVersion 1 &&
        git sparse-checkout init --cone &&
        git sparse-checkout set PYTHON/4CPU
      component: dev
events:
  postStart:
    - sparse-checkout
